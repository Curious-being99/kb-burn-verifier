name: SilverScript burn contract compile

on:
  push:
    paths:
      - "contracts/**"
      - ".github/workflows/silverscript-burn.yml"
  pull_request:
    paths:
      - "contracts/**"
      - ".github/workflows/silverscript-burn.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kaspanet/silverscript
          ref: 15b7bc27680bdf0d83b294fbbfda55ecb59958ca
          path: vendor/silverscript
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile burn-enabled KCC-20 contract
        run: |
          cargo run --locked --manifest-path vendor/silverscript/Cargo.toml -p silverscript-lang --bin silverc -- \
            contracts/kb_kcc20_burn.sil \
            --constructor-args contracts/kb-burn-compile-args.json \
            -o target/kb-kcc20-burn.json
      - uses: actions/upload-artifact@v4
        with:
          name: kb-kcc20-burn-silverscript-artifact
          path: target/kb-kcc20-burn.json
          if-no-files-found: error
